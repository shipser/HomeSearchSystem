services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: apartment-checklist:latest
    container_name: apartment-checklist
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUBLIC_URL=${PUBLIC_URL:-}
    volumes:
      # Persistent SQLite database storage on host
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/forms').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
